<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" type="text/css" />
    <title>Home Page</title>
  </head>

  <body>
    <div class="container">
      <h1>Hi student, Welcome to XYZ University!</h1>

      <p>
        You can sign up to the platform to access all important notes &
        lectures.
      </p>

      <form action="/addUser" method="POST">
        <div class="field">
          <label>Email:</label>

          <input
            type="email"
            placeholder="jane@email.com"
            name="email"
            required
          />
        </div>

        <div class="field">
          <label>Username:</label>

          <input type="text" placeholder="Jane Doe" name="username" required />
        </div>

        <div class="field">
          <label>Password:</label>

          <input
            type="password"
            placeholder="password"
            name="password"
            required
          />
        </div>

        <div class="btnGroup">
          <button type="submit" id="formBtn">Add User</button>

          <a href="/users.html" target="_blank">
            <button type="button" id="getBtn">Get Existing Users</button>
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
